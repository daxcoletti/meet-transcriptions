[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meet-transcriptions"
version = "2.4.2"
description = "Transcriptor automático de reuniones con rotación de APIs gratuitas (transcripción + diarización + minuta)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "TRANS-IT Foundation" }]
dependencies = [
    "requests",
    "langdetect",
    "filelock",
    "platformdirs",
    "watchdog",
]

[project.optional-dependencies]
# GUI de escritorio (bandeja del sistema + wizard de configuración).
# PyAudioWPatch: loopback WASAPI para grabar el audio del sistema en Windows.
gui = ["PySide6>=6.6", 'PyAudioWPatch; sys_platform == "win32"']
# Barra de progreso en el modo CLI
cli = ["tqdm"]

[project.scripts]
meet-transcriptions-cli = "transcriptor.cli:main"

[project.gui-scripts]
meet-transcriptions = "transcriptor.gui.app:main"

[tool.setuptools.packages.find]
include = ["transcriptor*"]
