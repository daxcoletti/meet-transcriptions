name: Build Windows installer

on:
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    tags: ["v*"]            # o taggear un release: git tag v2.0.0 && git push --tags

env:
  PYTHONUTF8: "1"   # la consola de Windows es cp1252; evita UnicodeEncodeError

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install ".[gui]" pyinstaller

      - name: Generar icono
        run: python packaging/make_icon.py

      - name: Generar metadata de versión del exe
        run: python packaging/make_version_info.py

      - name: Build PyInstaller (onedir)
        run: pyinstaller packaging/transcriptor.spec

      - name: Compilar instalador (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MeetTranscriptions-Setup
          path: packaging/Output/*.exe
