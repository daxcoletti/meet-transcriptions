name: Build installers

on:
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    tags: ["v*"]            # o taggear un release: git tag v2.0.0 && git push --tags

env:
  PYTHONUTF8: "1"   # la consola de Windows es cp1252; evita UnicodeEncodeError

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install ".[gui]" pyinstaller

      - name: Generar icono
        run: python packaging/make_icon.py

      - name: Generar metadata de versión del exe
        run: python packaging/make_version_info.py

      - name: Build PyInstaller (onedir)
        run: pyinstaller packaging/transcriptor.spec

      - name: Compilar instalador (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MeetTranscriptions-Setup
          path: packaging/Output/*.exe

  # Paquete .deb para Debian/Ubuntu. Se construye en ubuntu-22.04 (glibc
  # 2.35): el bundle de PyInstaller corre en esa versión o más nuevas.
  build-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1
          pip install ".[gui]" pyinstaller

      - name: Build PyInstaller (onedir)
        run: pyinstaller packaging/transcriptor.spec

      - name: Armar paquete .deb
        run: bash packaging/build_deb.sh

      - name: Subir .deb como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MeetTranscriptions-deb
          path: dist/*.deb

  # Al taggear vX.Y.Z, el release se publica SOLO con los 4 archivos:
  # exe y deb, cada uno versionado + con nombre fijo (para los links
  # permanentes releases/latest/download/...). Garantiza que el paquete
  # de Debian/Ubuntu salga SIEMPRE junto con el de Windows.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Preparar assets (copias con nombre fijo)
        run: |
          mkdir out
          cp artifacts/MeetTranscriptions-Setup/*.exe out/
          cp artifacts/MeetTranscriptions-deb/*.deb out/
          cp out/MeetTranscriptions-Setup-*.exe out/MeetTranscriptions-Setup.exe
          cp out/meet-transcriptions_*_amd64.deb out/meet-transcriptions_amd64.deb
          ls -la out/

      - name: Publicar release (o completar assets si ya existe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            printf '%s\n' \
              "**Descarga directa (siempre la última versión):**" \
              "- Windows: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/MeetTranscriptions-Setup.exe" \
              "- Debian/Ubuntu: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/meet-transcriptions_amd64.deb" \
              "" > notes.md
            gh release create "$TAG" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Meet Transcriptions ${TAG#v}" \
              --notes-file notes.md \
              --generate-notes
          fi
